version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # next.config.ts sets output: 'export' -- `next build` writes the
        # static site straight to out/, no separate `next export` step.
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
