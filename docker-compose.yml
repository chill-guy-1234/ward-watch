# Values come from the .env file in this directory (gitignored).
# Copy .env.example to .env before running. Compose loads .env automatically.
services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 with the pgvector extension preinstalled
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # left = port on your machine, right = port inside the container.
      # Change the left one if something else already uses 5432 locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  flyway:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` (not localhost) — Flyway runs inside the Docker network, where the
      # database answers to its service name.
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: migrate

volumes:
  db_data:
